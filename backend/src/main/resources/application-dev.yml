# Development profile: enables Swagger/OpenAPI for local API inspection.
spring:
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

logging:
  level:
    com.nexora: DEBUG
    org.flywaydb: INFO

